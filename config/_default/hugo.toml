# -- Site Configuration --
# Refer to the theme docs for more details about each of these parameters.
# https://blowfish.page/docs/getting-started/

theme = "blowfish" # UNCOMMENT THIS LINE
baseURL = "https://criticalsignals.nz/"
defaultContentLanguage = "en"

# Event dates (`date:`, `dates:`) are written as plain "2026-08-06" strings
# with no offset — Ticket Tailor exports them that way, meaning Wellington
# local time. Without this, Hugo parses them as UTC midnight, which silently
# shifts every event's calendar day depending on nothing more than whether a
# timezone happens to be set. This does not affect `now` (see
# layouts/partials/now-nzt.html), only front-matter date parsing.
timeZone = "Pacific/Auckland"

# pluralizeListTitles = "true" # hugo function useful for non-english languages, find out more in  https://gohugo.io/getting-started/configuration/#pluralizelisttitles

enableRobotsTXT = true
summaryLength = 0

buildDrafts = false
buildFuture = true

enableEmoji = true

# googleAnalytics = "G-XXXXXXXXX"

[pagination]
  pagerSize = 100

[imaging]
  anchor = 'Center'
  # Hugo's default resampleFilter is Box, the cheapest and softest option. Nearly
  # every image on this site is downscaled hard — people photos go from ~2880px
  # or 3812px wide down to 600, and the background masters from 1920 to 640 — and
  # at those ratios Box visibly smears detail. CatmullRom is sharp without the
  # ringing Lanczos can add on high-contrast edges, and costs only build time.
  resampleFilter = 'CatmullRom'
  # Default is 75. These are photographs shown large, and the sharper resampler
  # above means 80 lands closer to the original than 75 did before.
  quality = 80

# CRITICAL SIGNALS: `tag` only. category/author/series were Blowfish defaults
# that no content ever used — verified: nothing in content/ sets any of them,
# and the three listing pages Hugo built for them contained zero term links.
# The RSS note below already recorded them as "taxonomies with no content at
# all"; this stops building the empty HTML pages as well as the empty feeds.
#
# Three fewer pages, and three fewer pages depending on the theme's stylesheet.
# `tag` stays: /tags/core-team/ and /tags/organisation/ are real and linked.
[taxonomies]
  tag = "tags"

[sitemap]
  changefreq = 'daily'
  filename = 'sitemap.xml'
  priority = 0.5

# taxonomy/term are HTML-only so Hugo stops emitting RSS for them. Six feeds
# went away: /categories/, /authors/ and /series/ were feeds for taxonomies with
# no content at all (nothing in content/ sets those terms), and /tags/index.xml
# plus the per-tag /tags/core-team/ and /tags/organisation/ feeds are not
# something anyone subscribes to.
#
# The section feeds are deliberately untouched — /index.xml (whole site),
# /people/index.xml and /programme/index.xml are real, usable feeds.
[outputs]
  home = ["HTML", "RSS", "JSON"]
  taxonomy = ["HTML"]
  term = ["HTML"]

# The minifier rewrites `catch (e) {}` to `catch {}` when the binding is
# unused. That is ES2019 optional catch binding, and the 2016 signage panel
# at /sign/ throws a SyntaxError on it and shows a black screen — a failure
# that appears only in the CI build, never under `hugo server`. Pinning the
# target version stops the minifier introducing any post-ES5 syntax. It only
# constrains what minification may emit; it does not transpile existing code,
# so the theme's own JavaScript is unaffected.
[minify]
  [minify.tdewolff]
    [minify.tdewolff.js]
      version = 5

# Emits /sign/rev.json alongside /sign/index.html. The signage panel polls it
# every 10s and reloads when the value changes, so a deploy reaches the screen
# without anyone walking over to it. See layouts/sign/CLAUDE.md.
[outputFormats]
  [outputFormats.SIGNREV]
    mediaType = "application/json"
    baseName = "rev"
    isPlainText = true
    notAlternative = true

[related]
  threshold = 0
  toLower = false

    [[related.indices]]
        name = "tags"
        weight = 100

    [[related.indices]]
        name = "categories"
        weight = 100

    [[related.indices]]
        name = "series"
        weight = 50

    [[related.indices]]
        name = "authors"
        weight = 20

    [[related.indices]]
        name = "date"
        weight = 10

    [[related.indices]]
      applyFilter = false
      name = 'fragmentrefs'
      type = 'fragments'
      weight = 10

[markup]
  [markup.goldmark]
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['\[', '\]'], ['$$', '$$']]
          inline = [['\(', '\)']]
