name: Deploy to Github Pages

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    # "Today" (Upcoming Events, programme past/upcoming split) is fixed at
    # build time, so rebuild just after Wellington midnight even when nothing
    # was pushed — otherwise yesterday's events linger until the next commit.
    # Cron is UTC: 11:05 is 00:05 NZDT, 12:05 is 00:05 NZST.
    schedule:
        - cron: "5 11,12 * * *"
    workflow_dispatch: {}

jobs:
    build:
        runs-on: ubuntu-latest

        permissions:
            # Give the default GITHUB_TOKEN write permission to commit and push the
            # added or changed files to the repository.
            contents: write

        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  submodules: recursive

            - name: Cache Hugo resources
              uses: actions/cache@v4
              env:
                  cache-name: cache-hugo-resources
              with:
                  path: resources
                  key: ${{ env.cache-name }}

            - uses: actions/setup-go@v5
              with:
                  go-version: "^1.17.0"
            - run: go version

            - name: Setup Hugo
              uses: peaceiris/actions-hugo@v2
              with:
                  hugo-version: "latest"
                  extended: true

            - name: Build
              run: hugo --minify --gc

            - name: Deploy 🚀
              uses: JamesIves/github-pages-deploy-action@v4
              with:
                  branch: gh-pages
                  folder: public
                  clean: true
                  single-commit: true
