{{- /* Home — full-bleed hero (wordmark over photo) + universal text column +
       spore/dates rail, then a middle image band the column ends over.
       The column's copy lives in content/_index.md. */ -}}
<header class="hero hero--home cs-hero" style="background-image:url('/images/design/img/4.jpeg')" data-img-spot>
  {{ partial "design/wordmark.html" . }}
  <div class="grid">
    <div class="col">
      <h1 class="sr-only">{{ .Title }}</h1>
      {{ .Content }}
    </div>
    {{ partial "design/rail.html" . }}
  </div>
</header>

<section class="imgband imgband--home">
  <img class="imgband__photo" src="/images/design/img/9.jpeg" alt="" data-img-spot>
</section>
